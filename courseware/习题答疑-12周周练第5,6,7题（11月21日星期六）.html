<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>高中数学一轮核心专题 · 三题互动自学实验室</title>
  <style>
    :root {
      --bg-base: #070d19;
      --bg-card: #0f172a;
      --bg-panel: #162035;
      --bg-inset: #0a101d;
      --border-subtle: #1e293b;
      --border-active: #3b82f6;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-blue: #2563eb;
      --accent-amber: #f59e0b;
      --accent-emerald: #10b981;
      --accent-rose: #f43f5e;
      --math-font: "Times New Roman", "STIXGeneral", "Cambria Math", Georgia, serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.65;
      overflow-x: hidden;
    }

    /* ================= 出版级纯离线数学公式排版样式 ================= */
    .m-var {
      font-family: var(--math-font);
      font-style: italic;
      padding: 0 1px;
    }
    .m-func {
      font-family: var(--math-font);
      font-style: normal;
      padding: 0 1px;
    }
    .m-frac {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      vertical-align: middle;
      margin: 0 3px;
      font-family: var(--math-font);
      font-size: 0.92em;
      line-height: 1.15;
    }
    .m-frac-num {
      padding: 0 4px 1px 4px;
      border-bottom: 1.2px solid currentColor;
      text-align: center;
      white-space: nowrap;
    }
    .m-frac-den {
      padding: 2px 4px 0 4px;
      text-align: center;
      white-space: nowrap;
    }
    .m-sqrt {
      display: inline-flex;
      align-items: stretch;
      vertical-align: middle;
      margin: 0 2px;
      font-family: var(--math-font);
    }
    .m-sqrt-sym {
      font-size: 1.15em;
      line-height: 1;
      padding-right: 1px;
      display: inline-flex;
      align-items: center;
    }
    .m-sqrt-body {
      border-top: 1.2px solid currentColor;
      padding: 1px 3px 0 2px;
      line-height: 1.2;
    }
    .m-cases {
      display: inline-flex;
      align-items: center;
      vertical-align: middle;
      margin: 4px 4px;
      font-family: var(--math-font);
    }
    .m-cases-brace {
      font-size: 2.2em;
      line-height: 1;
      font-weight: 300;
      margin-right: 4px;
      transform: scaleY(1.15);
    }
    .m-cases-rows {
      display: flex;
      flex-direction: column;
      gap: 3px;
      text-align: left;
      font-size: 0.95em;
    }
    sup.m-sup, sub.m-sub {
      font-family: var(--math-font);
      font-size: 0.76em;
      line-height: 0;
    }
    .fill-blank {
      display: inline-block;
      min-width: 84px;
      border-bottom: 2px solid #fbbf24;
      color: #fbbf24;
      text-align: center;
      font-weight: 800;
      padding: 0 8px;
      margin: 0 4px;
      transition: all 0.25s;
    }

    /* ================= 顶部导航栏 ================= */
    header {
      background: rgba(15, 23, 42, 0.96);
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #2563eb, #10b981);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 16px;
      color: #fff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
      flex-shrink: 0;
    }
    .brand-title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.3px;
      color: #fff;
    }

    .nav-tabs {
      display: flex;
      background: var(--bg-inset);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      gap: 4px;
      flex-wrap: wrap;
    }
    .nav-tab {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 9px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.18s;
    }
    .nav-tab:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
    }
    .nav-tab.active {
      background: var(--accent-blue);
      color: #fff;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .progress-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
    }
    .progress-track {
      width: 64px;
      height: 6px;
      background: #1e293b;
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent-emerald);
      width: 0%;
      transition: width 0.3s;
    }
    .btn-review {
      background: rgba(245, 158, 11, 0.16);
      border: 1px solid rgba(245, 158, 11, 0.45);
      color: #fbbf24;
      padding: 8px 13px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s;
    }
    .btn-review:hover {
      background: rgba(245, 158, 11, 0.28);
    }

    /* ================= 主体响应式双栏布局 ================= */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 16px;
      padding: 16px;
      max-width: 1680px;
      width: 100%;
      margin: 0 auto;
    }
    @media (max-width: 1024px) {
      main {
        grid-template-columns: 1fr;
        padding: 12px;
      }
    }

    .col-left, .col-right {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    }

    /* 题干区 */
    .prob-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }
    .prob-badge {
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 6px;
      background: rgba(37, 99, 235, 0.2);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.35);
    }
    .prob-hint {
      font-size: 12px;
      color: var(--text-muted);
    }
    .prob-body {
      font-size: 15.5px;
      color: #f8fafc;
      line-height: 1.85;
    }
    .prob-opts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 6px 14px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #1e293b;
      font-size: 14.5px;
      color: #cbd5e1;
    }

    /* 动态画板卡片 */
    .canvas-card {
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .canvas-toolbar {
      background: var(--bg-inset);
      border-bottom: 1px solid var(--border-subtle);
      padding: 10px 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .tool-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tool-btn {
      background: var(--bg-panel);
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
    }
    .tool-btn:hover {
      background: #1e293b;
      border-color: #475569;
    }
    .tool-btn.active-blue {
      background: rgba(37, 99, 235, 0.28);
      border-color: #3b82f6;
      color: #93c5fd;
    }
    .tool-btn.active-emerald {
      background: rgba(16, 185, 129, 0.25);
      border-color: #10b981;
      color: #6ee7b7;
    }

    .canvas-viewport {
      width: 100%;
      height: 390px;
      position: relative;
      background: radial-gradient(circle at center, #0f172a 0%, #060a12 100%);
      touch-action: pan-y;
    }
    @media (max-width: 768px) {
      .canvas-viewport { height: 320px; }
    }
    canvas#geo-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .canvas-footer {
      background: var(--bg-inset);
      border-top: 1px solid var(--border-subtle);
      padding: 7px 14px;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* 参数滑块与实时监控仪 */
    .telemetry-card {
      transition: box-shadow 0.3s, border-color 0.3s;
    }
    .telemetry-card.hit-glow {
      border-color: rgba(16, 185, 129, 0.65);
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.18);
    }
    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }
    .slider-title {
      font-size: 14px;
      font-weight: 700;
      color: #fbbf24;
    }
    .slider-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .param-badge {
      background: var(--bg-inset);
      border: 1px solid #334155;
      color: #fbbf24;
      padding: 3px 10px;
      border-radius: 6px;
      font-family: var(--math-font);
      font-size: 13.5px;
      font-weight: 700;
    }
    .btn-preset {
      background: rgba(16, 185, 129, 0.16);
      border: 1px solid rgba(16, 185, 129, 0.42);
      color: #34d399;
      padding: 4px 9px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-preset:hover {
      background: rgba(16, 185, 129, 0.32);
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 10px;
      border-radius: 5px;
      background: linear-gradient(90deg, #1d4ed8, #3b82f6, #10b981);
      outline: none;
      margin: 6px 0 14px 0;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #fbbf24;
      border: 3px solid #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      cursor: pointer;
    }

    .radar-box {
      background: var(--bg-inset);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 12px 14px;
    }
    .radar-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 8px;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
      flex-wrap: wrap;
      gap: 6px;
    }
    .status-tag {
      padding: 2px 9px;
      border-radius: 6px;
      font-size: 12px;
    }
    .status-active {
      background: rgba(16, 185, 129, 0.22);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.45);
    }
    .status-warn {
      background: rgba(244, 63, 94, 0.22);
      color: #fda4af;
      border: 1px solid rgba(244, 63, 94, 0.5);
    }
    .radar-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 8px;
      font-size: 13px;
    }
    .metric-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.02);
      padding: 6px 10px;
      border-radius: 8px;
    }
    .metric-label { color: var(--text-muted); }
    .metric-val { font-weight: 700; color: #fff; }

    /* ================= 右侧闯关互动区 ================= */
    .right-card {
      padding: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex: 1;
    }
    .subtabs-bar {
      background: var(--bg-inset);
      border-bottom: 1px solid var(--border-subtle);
      padding: 10px 14px 0 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .subtabs-group {
      display: flex;
      gap: 6px;
    }
    .subtab {
      border: 1px solid transparent;
      border-bottom: none;
      background: transparent;
      color: var(--text-muted);
      padding: 9px 14px;
      border-radius: 10px 10px 0 0;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .subtab.active-guided {
      background: var(--bg-card);
      border-color: var(--border-subtle);
      color: #60a5fa;
    }
    .subtab.active-variant {
      background: var(--bg-card);
      border-color: var(--border-subtle);
      color: #fbbf24;
    }

    .pills-bar {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      background: rgba(15, 23, 42, 0.8);
    }
    .step-pill {
      flex: 1;
      min-width: 68px;
      text-align: center;
      padding: 5px 8px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid var(--border-subtle);
      background: var(--bg-inset);
      color: #64748b;
    }
    .step-pill.unlocked {
      border-color: #3b82f6;
      background: rgba(37, 99, 235, 0.2);
      color: #93c5fd;
    }
    .step-pill.done {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
    }

    .steps-scroll {
      padding: 16px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: 700px;
    }

    .step-card {
      background: var(--bg-panel);
      border: 1px solid #28354f;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .step-card.done {
      border-color: rgba(16, 185, 129, 0.45);
    }
    .step-card.locked {
      background: var(--bg-inset);
      border-color: var(--border-subtle);
      opacity: 0.62;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      padding: 13px 16px;
    }
    .step-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .step-title {
      font-size: 15px;
      font-weight: 800;
      color: #93c5fd;
    }
    .step-card.done .step-title {
      color: #34d399;
    }
    .step-status {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 700;
      background: rgba(245, 158, 11, 0.18);
      color: #fbbf24;
    }
    .step-card.done .step-status {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
    }

    .kp-tag-box {
      background: rgba(37, 99, 235, 0.12);
      border: 1px dashed rgba(96, 165, 250, 0.4);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      color: #bae6fd;
    }

    .step-question {
      font-size: 15px;
      color: #f1f5f9;
      line-height: 1.85;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .opt-btn {
      width: 100%;
      text-align: left;
      background: #0f172a;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.75;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      transition: all 0.15s;
    }
    .opt-btn:hover {
      background: #1e293b;
      border-color: #60a5fa;
    }
    .opt-btn.correct-selected {
      background: rgba(6, 78, 59, 0.55);
      border-color: #10b981;
      color: #d1fae5;
      font-weight: 600;
    }
    .opt-letter {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #1e293b;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .opt-btn.correct-selected .opt-letter {
      background: #10b981;
      color: #064e3b;
    }

    .feedback-box {
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 13.5px;
      line-height: 1.75;
    }
    .feedback-ok {
      background: rgba(6, 78, 59, 0.45);
      border: 1px solid rgba(16, 185, 129, 0.45);
      color: #a7f3d0;
    }
    .feedback-err {
      background: rgba(136, 19, 55, 0.45);
      border: 1px solid rgba(244, 63, 94, 0.5);
      color: #fecdd3;
    }

    .explanation-box {
      background: var(--bg-inset);
      border: 1px solid #1e293b;
      border-left: 3px solid #3b82f6;
      border-radius: 10px;
      padding: 13px 15px;
      font-size: 14px;
      color: #e2e8f0;
      line-height: 1.85;
    }

    .right-footer {
      background: var(--bg-inset);
      border-top: 1px solid var(--border-subtle);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .btn-teacher {
      background: rgba(37, 99, 235, 0.18);
      border: 1px solid rgba(59, 130, 246, 0.45);
      color: #93c5fd;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-teacher:hover {
      background: rgba(37, 99, 235, 0.32);
      color: #fff;
    }

    /* ================= 知识点复习抽屉弹窗 ================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.85);
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal-box {
      background: var(--bg-card);
      border: 1px solid #334155;
      border-radius: 18px;
      max-width: 960px;
      width: 100%;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.65);
    }
    .modal-head {
      background: var(--bg-inset);
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-head h2 {
      font-size: 17px;
      font-weight: 800;
      color: #fbbf24;
    }
    .btn-close {
      background: var(--bg-panel);
      border: 1px solid #334155;
      color: #cbd5e1;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    .modal-body {
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      font-size: 14.5px;
      line-height: 1.85;
    }
    .review-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 12px;
    }
    .review-item {
      background: var(--bg-panel);
      border: 1px solid #28354f;
      border-radius: 12px;
      padding: 14px;
    }
    .review-item h4 {
      color: #60a5fa;
      margin-bottom: 6px;
      font-size: 15px;
    }
    .review-table {
      width: 100%;

    /************************************************************************
     * 1. 单遍扫描词法公式渲染器 (Single-Pass Tokenizer)
     *    纯 DOM/安全HTML 结构输出，杜绝任何转义字符与反斜杠泄漏
     ************************************************************************/
    function parseBracketContent(str, startIdx) {
      let depth = 1;
      let i = startIdx;
      while (i < str.length && depth > 0) {
        if (str[i] === '[' && str[i + 1] === '[') {
          depth++;
          i += 2;
        } else if (str[i] === ']' && str[i + 1] === ']') {
          depth--;
          if (depth === 0) {
            return { content: str.slice(startIdx, i), nextIdx: i + 2 };
          }
          i += 2;
        } else {
          i++;
        }
      }
      return { content: str.slice(startIdx), nextIdx: str.length };
    }

    function splitTopLevelPipe(content) {
      const parts = [];
      let depth = 0;
      let last = 0;
      for (let i = 0; i < content.length; i++) {
        if (content[i] === '[' && content[i + 1] === '[') {
          depth++;
          i++;
        } else if (content[i] === ']' && content[i + 1] === ']') {
          depth--;
          i++;
        } else if (content[i] === '|' && depth === 0) {
          parts.push(content.slice(last, i));
          last = i + 1;
        }
      }
      parts.push(content.slice(last));
      return parts;
    }

    function renderFormulaText(input) {
      if (!input) return "";
      let out = "";
      let i = 0;
      while (i < input.length) {
        // 1. 匹配自定义结构标记 [[tag:...]]
        if (input[i] === '[' && input[i + 1] === '[') {
          const parsed = parseBracketContent(input, i + 2);
          const colonPos = parsed.content.indexOf(':');
          if (colonPos !== -1) {
            const tag = parsed.content.slice(0, colonPos);
            const body = parsed.content.slice(colonPos + 1);
            if (tag === 'frac') {
              const [num, den] = splitTopLevelPipe(body);
              out += `<span class="m-frac"><span class="m-frac-num">${renderFormulaText(num)}</span><span class="m-frac-den">${renderFormulaText(den || '')}</span></span>`;
            } else if (tag === 'sqrt') {
              out += `<span class="m-sqrt"><span class="m-sqrt-sym">√</span><span class="m-sqrt-body">${renderFormulaText(body)}</span></span>`;
            } else if (tag === 'sup') {
              out += `<sup class="m-sup">${renderFormulaText(body)}</sup>`;
            } else if (tag === 'sub') {
              out += `<sub class="m-sub">${renderFormulaText(body)}</sub>`;
            } else if (tag === 'func') {
              out += `<span class="m-func">${body}</span>`;
            } else if (tag === 'cases') {
              const rows = splitTopLevelPipe(body);
              const rowsHtml = rows.map(r => `<div>${renderFormulaText(r)}</div>`).join('');
              out += `<span class="m-cases"><span class="m-cases-brace">{</span><span class="m-cases-rows">${rowsHtml}</span></span>`;
            } else if (tag === 'blank') {
              out += `<span class="fill-blank" id="main-blank">${renderFormulaText(body)}</span>`;
            } else {
              out += renderFormulaText(body);
            }
          } else {
            out += parsed.content;
          }
          i = parsed.nextIdx;
          continue;
        }

        // 2. 跳过已有 HTML 标签（如 <strong>, <br>）
        if (input[i] === '<') {
          const closeTag = input.indexOf('>', i);
          if (closeTag !== -1) {
            out += input.slice(i, closeTag + 1);
            i = closeTag + 1;
            continue;
          }
        }

        // 3. 单个英文字母渲染为数学衬线斜体
        const ch = input[i];
        if (/[A-Za-z]/.test(ch)) {
          out += `<span class="m-var">${ch}</span>`;
          i++;
          continue;
        }

        out += ch;
        i++;
      }
      return out;
    }

    function drawPoint(x, y, color, r = 5, label = "", offset = { x: 8, y: -8 }) {
      ctx.save();
      ctx.beginPath();

      }
      ctx.restore();

    function renderCanvas() {
      const rect = wrap.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.round(w * dpr);

        const plotH = h - padT - padB;
        const xMin = -Math.PI / 2, xMax = Math.PI;
        const yMin = -1.6, yMax = 3.6;

        const mapX = (xv) => padL + ((xv - xMin) / (xMax - xMin)) * plotW;
        const mapY = (yv) => padT + ((yMax - yv) / (yMax - yMin)) * plotH;

        // 网格与参考线
        ctx.strokeStyle = 'rgba(30, 41, 59, 0.5)';

        [-1, 0, 1, 2, 3].forEach(yv => {
          const py = mapY(yv);

          ctx.fillStyle = '#94a3b8';
          ctx.font = '12px "Times New Roman", sans-serif';
          ctx.textAlign = 'right';

        // X 轴与关键刻度
        const yZero = mapY(0);
        ctx.strokeStyle = '#64748b';

            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(pA.x, pA.y);
            ctx.lineTo(pH.x, pH.y);
            ctx.closePath();
            ctx.fillStyle = 'rgba(244, 63, 94, 0.2)';
            ctx.fill();
            ctx.strokeStyle = '#f43f5e';
            ctx.lineWidth = 1.8;
            ctx.stroke();
            ctx.restore();
          }

          // 高亮公共弦 AB
          ctx.save();
          ctx.beginPath();
          ctx.strokeStyle = '#fbbf24';
          ctx.lineWidth = 3.8;
          ctx.moveTo(pA.x, pA.y);
          ctx.lineTo(pB.x, pB.y);
          ctx.stroke();
          ctx.restore();

          drawPoint(pA.x, pA.y, '#fbbf24', 5.5, 'A', { x: -18, y: -8 });
          drawPoint(pB.x, pB.y, '#fbbf24', 5.5, 'B', { x: 8, y: -8 });
        }

        drawPoint(cx, cy, '#60a5fa', 4.5, 'O(0,0)', { x: 8, y: 14 });
        drawPoint(pC.x, pC.y, '#34d399', 4.5, 'C(0,-1)', { x: 8, y: 14 });
      }

      ctx.restore();
    }

    const ro = new ResizeObserver(() => renderCanvas());
    ro.observe(wrap);

    function toggleExtraLayer() {
      showExtraLayer = !showExtraLayer;
      updateToolsUI();
      renderCanvas();
    }

    function resetExerciseParam() {
      const ex = EXERCISES[curExIdx];
      document.getElementById('param-slider').value = ex.defaultVal;
      onSliderInput();
    }

    function updateToolsUI() {
      const toolsDiv = document.getElementById('canvas-tools');
      const labels = [
        showExtraLayer ? '递增区间与对称轴标注：开' : '递增区间与对称轴标注：关',
        showExtraLayer ? '辅助圆与第三定义连线：开' : '辅助圆与第三定义连线：关',
        showExtraLayer ? '垂径定理与公共弦直线：开' : '垂径定理与公共弦直线：关'
      ];
      toolsDiv.innerHTML = `
        <button class="tool-btn ${showExtraLayer ? 'active-emerald' : ''}" onclick="toggleExtraLayer()">${labels[curExIdx]}</button>
        <button class="tool-btn" onclick="resetExerciseParam()">恢复默认位置</button>
      `;
    }

    /************************************************************************
     * 4. 滑块实时监控与闯关切换逻辑
     ************************************************************************/
    function onSliderInput() {
      const val = parseFloat(document.getElementById('param-slider').value);
      const card = document.getElementById('telemetry-card');
      const status = document.getElementById('radar-status');
      const grid = document.getElementById('radar-grid');

      if (curExIdx === 0) {
        document.getElementById('param-badge').textContent = `x = ${val.toFixed(2)}`;
        const phase = 2 * val + Math.PI / 6;
        const fy = 2 * Math.sin(phase) + 1;
        const slope = 4 * Math.cos(phase);
        const inInc = val > -Math.PI / 6 && val < Math.PI / 6;

        card.classList.toggle('hit-glow', inInc);
        status.className = `status-tag ${inInc ? 'status-active' : 'status-warn'}`;
        status.textContent = inInc ? '✓ 位于 (-π/6, π/6) 严格递增区间内' : (slope >= 0 ? '当前处于单调递增段' : '当前处于单调递减段');

        grid.innerHTML = renderFormulaText(`
          <div class="metric-row"><span class="metric-label">整体相位 2x + [[frac:π|6]]：</span><span class="metric-val">${phase.toFixed(2)} rad</span></div>
          <div class="metric-row"><span class="metric-label">实时函数值 f(x)：</span><span class="metric-val" style="color:#fbbf24">${fy.toFixed(3)}（范围 [-1, 3]）</span></div>
          <div class="metric-row"><span class="metric-label">当前单调性：</span><span class="metric-val" style="color:${slope >= 0 ? '#34d399' : '#fda4af'}">${slope >= 0 ? '单调递增 ↗' : '单调递减 ↘'}</span></div>
        `);
      } else if (curExIdx === 1) {
        document.getElementById('param-badge').textContent = `θ = ${val.toFixed(0)}°`;
        const rad = (val * Math.PI) / 180;
        const px = 5 * Math.cos(rad);
        const py = 4 * Math.sin(rad);
        const pf1 = Math.hypot(px + 3, py);
        const pf2 = Math.hypot(px - 3, py);
        const prod = pf1 * pf2;
        const cosAng = (pf1 * pf1 + pf2 * pf2 - 36) / (2 * pf1 * pf2);
        const angDeg = (Math.acos(Math.max(-1, Math.min(1, cosAng))) * 180) / Math.PI;
        const isTop = Math.abs(Math.sin(rad)) > 0.99;

        card.classList.toggle('hit-glow', isTop);
        status.className = 'status-tag status-active';
        status.textContent = isTop ? '★ 短轴端点：张角最大(锐角)且 |PF₁|·|PF₂| = 25！' : `∠F₁PF₂ = ${angDeg.toFixed(1)}° < 90°（恒为锐角）`;

        grid.innerHTML = renderFormulaText(`
          <div class="metric-row"><span class="metric-label">焦半径 |PF[[sub:1]]|（范围 [2, 8]）：</span><span class="metric-val">${pf1.toFixed(2)}</span></div>
          <div class="metric-row"><span class="metric-label">焦半径乘积 |PF[[sub:1]]|·|PF[[sub:2]]|：</span><span class="metric-val" style="color:${isTop ? '#34d399' : '#fbbf24'}">${prod.toFixed(2)}（最大 25）</span></div>
          <div class="metric-row"><span class="metric-label">第三定义 k[[sub:PA]] · k[[sub:PB]]：</span><span class="metric-val">${Math.abs(py) < 0.05 ? '顶点处斜率不存在' : '-16/25 (-0.64)'}</span></div>
        `);
      } else if (curExIdx === 2) {
        document.getElementById('param-badge').textContent = `D = ${val.toFixed(1)}`;
        const r2 = Math.sqrt(Math.max(0.01, 1 - val));
        const yChord = (-4 - val) / 2;
        const isInter = Math.abs(r2 - 2) < 1 && 1 < r2 + 2;
        const chordLen = isInter ? 2 * Math.sqrt(Math.max(0, 4 - yChord * yChord)) : 0;
        const isOrig = Math.abs(val - (-6)) < 0.05;

        card.classList.toggle('hit-glow', isOrig);
        status.className = `status-tag ${isInter ? 'status-active' : 'status-warn'}`;
        status.textContent = isOrig
          ? '★ 原题位置 (D=-6)：公共弦 y=1，弦长 = 2√3！'
          : (isInter ? '两圆相交（存在公共弦）' : '两圆不相交（无公共弦）');

        grid.innerHTML = renderFormulaText(`
          <div class="metric-row"><span class="metric-label">圆 C 半径 r[[sub:2]] = [[sqrt:1 - D]]：</span><span class="metric-val">${r2.toFixed(2)}（圆心距 |OC| = 1）</span></div>
          <div class="metric-row"><span class="metric-label">公共弦直线方程：</span><span class="metric-val">y = ${yChord.toFixed(2)}</span></div>
          <div class="metric-row"><span class="metric-label">当前公共弦长 |AB|：</span><span class="metric-val" style="color:${isOrig ? '#34d399' : '#fbbf24'}">${isOrig ? '2√3 (≈ 3.464)' : (isInter ? chordLen.toFixed(3) : '0 (不相交)')}</span></div>
        `);
      }

      renderCanvas();
    }

    function setPresetVal(v) {
      document.getElementById('param-slider').value = v;
      onSliderInput();
    }

    function switchExercise(idx) {
      curExIdx = idx;
      curSubMode = 'guided';

      for (let i = 0; i < 3; i++) {
        document.getElementById(`tab-${i}`).classList.toggle('active', i === idx);
      }

      const ex = EXERCISES[idx];
      document.getElementById('prob-badge').textContent = ex.badge;
      document.getElementById('prob-text').innerHTML = renderFormulaText(ex.problem);
      document.getElementById('slider-label').innerHTML = renderFormulaText(ex.sliderLabel);

      const footer = document.getElementById('canvas-footer');
      footer.innerHTML = ex.footerHint.map(t => `<span>${t}</span>`).join('');

      const slider = document.getElementById('param-slider');
      slider.min = ex.sliderMin;
      slider.max = ex.sliderMax;
      slider.step = ex.sliderStep;
      slider.value = ex.defaultVal;

      const presetDiv = document.getElementById('preset-btns');
      presetDiv.innerHTML = ex.presets.map(p =>
        `<button class="btn-preset" onclick="setPresetVal(${p.val})">${p.label}</button>`
      ).join('');

      document.getElementById('modal-title').textContent = ex.reviewTitle;
      document.getElementById('review-modal-body').innerHTML = renderFormulaText(ex.reviewHtml);

      updateToolsUI();
      onSliderInput();
      updateSubTabsUI();
    }

    function switchSubMode(mode) {
      curSubMode = mode;
      updateSubTabsUI();
    }

    function updateSubTabsUI() {
      document.getElementById('subtab-guided').className = `subtab ${curSubMode === 'guided' ? 'active-guided' : ''}`;
      document.getElementById('subtab-variant').className = `subtab ${curSubMode === 'variant' ? 'active-variant' : ''}`;
      renderSteps();
    }

    function renderSteps() {
      const ex = EXERCISES[curExIdx];
      const steps = curSubMode === 'guided' ? ex.guidedSteps : ex.variantSteps;
      const unlockedMax = progressState.unlocked[curExIdx][curSubMode];
      const doneArr = progressState.done[curExIdx][curSubMode];

      const pillsBar = document.getElementById('pills-bar');
      pillsBar.innerHTML = steps.map((_, idx) => {
        const isDone = doneArr[idx];
        const isUnlocked = idx <= unlockedMax;
        const cls = isDone ? 'done' : (isUnlocked ? 'unlocked' : '');
        const mark = isDone ? '✓ ' : (isUnlocked ? '● ' : '🔒 ');
        return `<div class="step-pill ${cls}">${mark}第 ${idx + 1} 关</div>`;
      }).join('');

      const container = document.getElementById('steps-container');
      container.innerHTML = steps.map((st, sIdx) => {
        const isDone = doneArr[sIdx];
        const isUnlocked = sIdx <= unlockedMax;

        if (!isUnlocked) {
          return `
            <div class="step-card locked">
              <span style="font-weight:700;font-size:14px;">🔒 ${renderFormulaText(st.title)}</span>
              <span style="font-size:12px;">完成上一关后解锁</span>
            </div>
          `;
        }

        const optsHtml = st.options.map((opt, oIdx) => {
          const isCorrectDone = isDone && opt.correct;
          return `
            <button class="opt-btn ${isCorrectDone ? 'correct-selected' : ''}" onclick="chooseOption(${sIdx}, ${oIdx})">
              <span class="opt-letter">${isCorrectDone ? '✓' : (oIdx === 0 ? 'A' : 'B')}</span>
              <span>${renderFormulaText(opt.text)}</span>
            </button>
          `;
        }).join('');

        const correctOpt = st.options.find(o => o.correct);

        return `
          <div class="step-card ${isDone ? 'done' : ''}" id="scard-${sIdx}">
            <div class="step-top">
              <div class="step-title">${renderFormulaText(st.title)}</div>
              <span class="step-status">${isDone ? '已通关' : '请作答'}</span>
            </div>
            <div class="kp-tag-box">${renderFormulaText('<strong>关联知识点复习：</strong>' + st.kp)}</div>
            <div class="step-question">${renderFormulaText(st.question)}</div>
            <div class="options-list">${optsHtml}</div>
            <div id="fb-${sIdx}" class="feedback-box ${isDone ? 'feedback-ok' : ''}" style="display:${isDone ? 'block' : 'none'};">
              ${isDone ? renderFormulaText('<strong>解析点评：</strong>' + correctOpt.feedback) : ''}
            </div>
            <div id="exp-${sIdx}" class="explanation-box" style="display:${isDone ? 'block' : 'none'};">
              ${renderFormulaText(st.explanation)}
            </div>
          </div>
        `;
      }).join('');

      updateGlobalProgress();
    }

    function fillCurrentBlank() {
      const ex = EXERCISES[curExIdx];
      const blankEl = document.getElementById('main-blank');
      if (blankEl) {
        blankEl.innerHTML = renderFormulaText(ex.answerFill);
        blankEl.style.color = '#34d399';
        blankEl.style.borderBottomColor = '#34d399';
      }
    }

    function chooseOption(sIdx, oIdx) {
      const ex = EXERCISES[curExIdx];
      const steps = curSubMode === 'guided' ? ex.guidedSteps : ex.variantSteps;
      const step = steps[sIdx];
      const chosen = step.options[oIdx];

      if (chosen.correct) {
        progressState.done[curExIdx][curSubMode][sIdx] = true;
        if (progressState.unlocked[curExIdx][curSubMode] <= sIdx && sIdx + 1 < steps.length) {
          progressState.unlocked[curExIdx][curSubMode] = sIdx + 1;
        }
        if (curSubMode === 'guided' && sIdx === steps.length - 1) {
          fillCurrentBlank();
        }
        renderSteps();
        setTimeout(() => {
          const nextEl = document.getElementById(`scard-${sIdx + 1}`);
          if (nextEl) nextEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 120);
      } else {
        const fb = document.getElementById(`fb-${sIdx}`);
        fb.style.display = 'block';
        fb.className = 'feedback-box feedback-err';
        fb.innerHTML = renderFormulaText('<strong>启发提示：</strong>' + chosen.feedback);
      }
    }

    function unlockCurrentAll() {
      const ex = EXERCISES[curExIdx];
      const steps = curSubMode === 'guided' ? ex.guidedSteps : ex.variantSteps;
      progressState.unlocked[curExIdx][curSubMode] = steps.length - 1;
      progressState.done[curExIdx][curSubMode] = steps.map(() => true);
      if (curSubMode === 'guided') {
        fillCurrentBlank();
      }
      renderSteps();
    }

    function updateGlobalProgress() {
      let total = 0;
      let done = 0;
      progressState.done.forEach(item => {
        item.guided.forEach(v => { total++; if (v) done++; });
        item.variant.forEach(v => { total++; if (v) done++; });
      });
      document.getElementById('progress-text').textContent = `${done} / ${total}`;
      document.getElementById('progress-fill').style.width = `${Math.round((done / total) * 100)}%`;
    }

    function toggleReviewModal() {
      document.getElementById('review-modal').classList.toggle('open');
    }

    window.onload = function () {
      switchExercise(0);
    };
  </script>
</body>
