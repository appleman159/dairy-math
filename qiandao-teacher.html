<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>签到查看（老师）</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #F7F3EB; color: #222; font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 24px; margin: 8px 0 4px; color: #0E6B66; }
  .sub { font-size: 14px; color: #666; margin-bottom: 16px; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  button { padding: 10px 16px; font-size: 15px; border-radius: 8px; cursor: pointer; border: 2px solid #0E6B66; background: #fff; color: #0E6B66; }
  button.primary { background: #0E6B66; color: #fff; }
  button.danger { border-color: #C62828; color: #C62828; }
  .cls { background: #fff; border: 2px solid #DDD6C4; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .cls h2 { margin: 0 0 10px; font-size: 20px; }
  .cls h2 .num { color: #D95D39; }
  .cls h2 .num.all { color: #0E6B66; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  td, th { padding: 7px 8px; border-bottom: 1px solid #EEE8D8; text-align: left; }
  th { color: #888; font-weight: normal; }
  .unsigned { margin-top: 12px; padding: 12px; background: #FDECEA; border-radius: 8px; font-size: 15px; line-height: 1.9; }
  .unsigned b { color: #C62828; }
  .ok { color: #0E6B66; }
  #msg { margin-top: 10px; font-size: 14px; color: #888; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📋 签到查看（老师专用）</h1>
  <div class="sub">这个页面不要发给学生。签到数据只保存在服务器上，学生只能看到自己的签到结果。</div>
  <div class="toolbar">
    <button class="primary" onclick="load(true)">🔄 刷新</button>
    <button onclick="copyUnsigned()">📋 复制未签到名单</button>
    <button class="danger" onclick="resetAll()">🗑 清空本次签到</button>
  </div>
  <div id="content"><p style="color:#888">加载中…</p></div>
  <div id="msg"></div>
</div>

<script>
let lastData = null;
async function load(manual) {
  try {
    const d = await (await fetch('/api/list')).json();
    lastData = d;
    render(d);
    document.getElementById('msg').textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
  } catch (e) {
    document.getElementById('content').innerHTML = '<p style="color:#C62828">加载失败，请检查网络后点刷新。</p>';
  }
}
function render(d) {
  let html = '';
  for (const cls of ['8班', '9班']) {
    const c = d.classes[cls];
    if (!c) continue;
    const all = c.signed === c.total;
    html += '<div class="cls"><h2>高二 ' + cls + '：已签到 <span class="num' + (all ? ' all' : '') + '">' + c.signed + ' / ' + c.total + '</span> 人</h2>';
    if (c.signed_list.length) {
      html += '<table><tr><th>姓名</th><th>签到时间</th></tr>' +
        c.signed_list.map(s => '<tr><td>' + s.name + '</td><td>' + s.time + '</td></tr>').join('') + '</table>';
    } else {
      html += '<p style="color:#888">还没有人签到</p>';
    }
    if (c.unsigned.length) {
      html += '<div class="unsigned"><b>未签到（' + c.unsigned.length + '人）：</b>' + c.unsigned.join('、') + '</div>';
    } else {
      html += '<div style="margin-top:12px" class="ok">✅ 全员已签到</div>';
    }
    html += '</div>';
  }
  document.getElementById('content').innerHTML = html;
}
function copyUnsigned() {
  if (!lastData) return;
  const lines = [];
  for (const cls of ['8班', '9班']) {
    const c = lastData.classes[cls];
    if (c && c.unsigned.length) lines.push(cls + '未签到（' + c.unsigned.length + '人）：' + c.unsigned.join('、'));
  }
  const text = lines.join('\n') || '两个班都已全员签到';
  navigator.clipboard.writeText(text).then(
    () => { document.getElementById('msg').textContent = '已复制未签到名单'; },
    () => { document.getElementById('msg').textContent = '复制失败，请手动选择复制'; });
}
async function resetAll() {
  if (!confirm('确定要清空全部签到记录吗？清空后学生需要重新签到。')) return;
  if (!confirm('再确认一次：真的清空吗？')) return;
  await fetch('/api/reset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
  load(true);
}
load(false);
setInterval(() => load(false), 60000);
</script>
</body>
</html>
