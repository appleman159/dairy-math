<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的首页 · 学生数学复习平台</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; background: #f1f5f9; color: #1e293b; }
.topbar { background: #0E6B66; color: #fff; padding: 14px 16px; }
.topbar .inner { max-width: 960px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.topbar h1 { font-size: 18px; margin: 0; }
.topbar .actions { display: flex; gap: 16px; align-items: center; }
.topbar a { color: #fff; font-size: 14px; text-decoration: none; }
.linkbtn { background: none; border: none; color: #fff; font-size: 14px; cursor: pointer; padding: 0; font-family: inherit; }
.container { max-width: 720px; margin: 0 auto; padding: 24px 16px 40px; }
.card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
.card h2 { font-size: 18px; margin: 0 0 4px; color: #0f172a; }
.card h2 .count { color: #0E6B66; font-size: 15px; }
.welcome { font-size: 20px; font-weight: 700; color: #0f172a; margin: 0 0 6px; }
.meta { color: #64748b; font-size: 14px; margin: 0; }
.meta span { margin-right: 16px; }
.empty { color: #94a3b8; font-size: 14px; padding: 8px 0; }
.item { border-top: 1px solid #f1f5f9; padding: 12px 0; }
.item:first-of-type { border-top: none; }
.item .t { font-weight: 700; font-size: 15px; color: #0f172a; }
.item .d { color: #475569; font-size: 14px; margin-top: 4px; line-height: 1.6; }
.item .m { color: #94a3b8; font-size: 13px; margin-top: 4px; }
.err { display: none; background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; border-radius: 8px; padding: 10px 12px; font-size: 14px; margin-bottom: 16px; }
.err.show { display: block; }
.badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.badge.lv0 { background: #f1f5f9; color: #64748b; }
.badge.lv1 { background: #fee2e2; color: #991b1b; }
.badge.lv2 { background: #fef3c7; color: #92400e; }
.badge.lv3 { background: #dcfce7; color: #166534; }
.stats { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
.stat { flex: 1; min-width: 120px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px 8px; text-align: center; }
.stat .num { font-size: 26px; font-weight: 800; color: #0E6B66; line-height: 1.2; }
.stat .lab { font-size: 13px; color: #64748b; margin-top: 4px; }
.prog { height: 10px; background: #e2e8f0; border-radius: 999px; overflow: hidden; margin-top: 10px; }
.prog .fill { height: 100%; background: #0E6B66; border-radius: 999px; }
.prog-text { font-size: 13px; color: #475569; margin-top: 6px; }
.kp-card { border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
.kp-card:last-child { margin-bottom: 0; }
.kp-card .t { font-weight: 700; font-size: 15px; color: #0f172a; }
.kp-card .t a { color: #0E6B66; text-decoration: none; }
.kp-card .d { color: #475569; font-size: 14px; margin-top: 4px; line-height: 1.6; }
.kp-card .m { color: #94a3b8; font-size: 13px; margin-top: 4px; }
.badge.done { background: #dcfce7; color: #166534; }
.wrong-summary { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px 14px; margin-bottom: 4px; }
.wrong-summary .m { color: #475569; font-size: 14px; }
.foot { text-align: center; color: #94a3b8; font-size: 13px; }
.foot a { color: #0E6B66; }
.wrong-link { display: block; text-decoration: none; color: inherit; cursor: pointer; border-top: 1px solid #f1f5f9; padding: 12px 0; }
.wrong-link:first-of-type { border-top: none; }
.wrong-link:hover .t { color: #0E6B66; }
.wrong-link .t { font-weight: 700; font-size: 15px; color: #0f172a; }
.wrong-link .m { color: #94a3b8; font-size: 13px; margin-top: 4px; }
.gtable { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 14px; }
.gtable th, .gtable td { border-bottom: 1px solid #f1f5f9; padding: 8px 4px; text-align: center; }
.gtable th { color: #64748b; font-weight: 600; }
.gtable td:first-child, .gtable th:first-child { text-align: left; }
.gtable td.num { font-weight: 700; color: #0f172a; }
.gmeta { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; font-size: 14px; color: #475569; }
.gmeta b { color: #0f172a; }

.qform textarea { width: 100%; min-height: 84px; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px 12px; font-size: 15px; font-family: inherit; resize: vertical; }
.qform input[type="file"] { font-size: 14px; margin-top: 10px; }
.qform .btn { margin-top: 12px; }
.qimg { max-width: 100%; border-radius: 8px; margin-top: 8px; border: 1px solid #e2e8f0; }
.qreply { background: #f0fdfa; border: 1px solid #99d5d1; border-radius: 8px; padding: 10px 12px; margin-top: 8px; font-size: 14px; line-height: 1.6; }
.qreply .who { color: #0E6B66; font-weight: 700; }
.btn { display: inline-block; border: none; border-radius: 8px; padding: 10px 18px; font-size: 15px; font-weight: 700; cursor: pointer; background: #0E6B66; color: #fff; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
</style>
</head>
<body>
<div class="topbar">
  <div class="inner">
    <h1>学生数学复习平台</h1>
    <div class="actions">
      <a href="/">返回课件资源站</a>
      <a href="change-password.html">修改密码</a>
      <button class="linkbtn" id="logoutBtn" type="button">退出登录</button>
    </div>
  </div>
</div>
<main class="container">
  <div class="err" id="err"></div>
  <div class="card">
    <p class="welcome" id="welcome">你好</p>
    <p class="meta"><span id="classLine"></span><span id="userLine"></span></p>
  </div>
  <div class="card" id="gradesCard" style="display:none">
    <h2>我的成绩</h2>
    <div id="gradesBody"><p class="empty">加载中…</p></div>
  </div>
  <div class="card">
    <h2>向老师提问</h2>
    <p class="meta" style="margin-bottom:12px;">有不懂的题可以在这里问老师，也可以传一张图片（比如题目照片）</p>
    <div class="qform">
      <textarea id="qContent" placeholder="写下你的问题…"></textarea>
      <input type="file" id="qImage" accept="image/*">
      <button class="btn" id="qSubmit" type="button">提交问题</button>
    </div>
    <div class="err" id="qErr" style="margin-top:12px;"></div>
    <div id="qList" style="margin-top:8px;"><p class="empty">加载中…</p></div>
  </div>
  <div class="card">
    <h2>我的学习情况</h2>
    <div class="stats">
      <div class="stat"><div class="num" id="statAnswered">—</div><div class="lab">累计答题</div></div>
      <div class="stat"><div class="num" id="statCorrect">—</div><div class="lab">累计答对</div></div>
      <div class="stat"><div class="num" id="statKpDone">—</div><div class="lab">已完成考点</div></div>
      <div class="stat"><div class="num" id="statPending">—</div><div class="lab">待订正错题</div></div>
    </div>
  </div>
  <div class="card">
    <h2>继续学习</h2>
    <div id="kpList"><p class="empty">加载中…</p></div>
  </div>
  <div class="card">
    <h2>我的错题 <span class="count" id="wrongCount"></span></h2>
    <div id="wrongSummary"><p class="empty">加载中…</p></div>
    <div id="wrongList"><p class="empty">加载中…</p></div>
  </div>
  <div class="card">
    <h2>我的任务 <span class="count" id="taskCount"></span></h2>
    <div id="taskList"><p class="empty">加载中…</p></div>
  </div>
  <div class="card">
    <h2>我的答题记录 <span class="count" id="recordCount"></span></h2>
    <div id="recordList"><p class="empty">加载中…</p></div>
  </div>
  <p class="foot">有问题请联系老师 · <a href="change-password.html">修改密码</a></p>
</main>
<script>
var me = null;

function showErr(msg) {
  var e = document.getElementById('err');
  e.textContent = msg;
  e.classList.add('show');
}
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

async function api(path, opts) {
  opts = opts || {};
  var headers = { 'Content-Type': 'application/json' };
  if (opts.csrf) headers['X-CSRF-Token'] = sessionStorage.getItem('csrf_token') || '';
  var res = await fetch(path, {
    method: opts.method || 'GET',
    credentials: 'include',
    headers: headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  var data = null;
  try { data = await res.json(); } catch (e) {}
  return { status: res.status, ok: res.ok, data: data || {} };
}

function renderTasks(tasks) {
  var box = document.getElementById('taskList');
  document.getElementById('taskCount').textContent = tasks.length ? '（' + tasks.length + '）' : '';
  if (!tasks.length) { box.innerHTML = '<p class="empty">暂无任务</p>'; return; }
  box.innerHTML = tasks.map(function (t) {
    var html = '<div class="item"><div class="t">' + esc(t.title || '任务') + '</div>';
    if (t.description) html += '<div class="d">' + esc(t.description) + '</div>';
    if (t.due_at) html += '<div class="m">截止：' + esc(t.due_at) + '</div>';
    return html + '</div>';
  }).join('');
}

function plainTitle(s, n) {
  var t = String(s == null ? '' : s).replace(/\$/g, '');
  return t.length > n ? t.slice(0, n) + '…' : t;
}

var kpPoints = null;
var wrongSum = null;

function updateStats() {
  if (kpPoints) {
    var totalAns = 0, totalCor = 0, done = 0;
    kpPoints.forEach(function (p) {
      totalAns += p.answered || 0;
      totalCor += p.correct_count || 0;
      if ((p.total_questions || 0) > 0 && (p.answered || 0) === p.total_questions) done++;
    });
    document.getElementById('statAnswered').textContent = totalAns;
    document.getElementById('statCorrect').textContent = totalCor;
    document.getElementById('statKpDone').textContent = done + '/' + kpPoints.length;
  }
  if (wrongSum) {
    document.getElementById('statPending').textContent = wrongSum.pending || 0;
  }
}

function renderWrongSummary(summary) {
  var box = document.getElementById('wrongSummary');
  if (!summary || (summary.total || 0) === 0) {
    box.innerHTML = '<p class="empty">还没有错题记录</p>';
    return;
  }
  var pending = summary.pending || 0;
  var resolved = summary.resolved || 0;
  var total = summary.total || 0;
  var pct = total ? Math.round(100 * resolved / total) : 0;
  box.innerHTML = '<div class="wrong-summary">' +
    '<div class="m">待订正 ' + pending + ' 道 · 已订正 ' + resolved + ' 道</div>' +
    '<div class="prog"><div class="fill" style="width:' + pct + '%"></div></div>' +
    '<div class="prog-text">订正进度 ' + resolved + '/' + total + ' · ' + pct + '%</div>' +
    '<div class="m">最近错题请点下面查看详情</div></div>';
}

function renderWrong(list, summary) {
  var box = document.getElementById('wrongList');
  document.getElementById('wrongCount').textContent = list.length ? '（' + list.length + '）' : '';
  renderWrongSummary(summary);
  if (!list.length) { box.innerHTML = '<p class="empty">暂无错题，继续保持</p>'; return; }
  box.innerHTML = list.map(function (w) {
    var title = plainTitle(w.content || w.title || w.question || '', 45) || ('错题 #' + (w.question_id || w.id || ''));
    var meta = [];
    if (w.kp_title) meta.push('考点：' + w.kp_title);
    if (w.wrong_count) meta.push('错了 ' + w.wrong_count + ' 次');
    if (w.first_wrong_at) meta.push('首次答错：' + w.first_wrong_at);
    var html = '<a class="wrong-link" href="wrong-detail.html?wid=' + w.id + '"><div class="t">' + esc(title) + '</div>';
    if (meta.length) html += '<div class="m">' + esc(meta.join(' · ')) + '</div>';
    html += '<div class="m"><span class="badge lv1">待订正</span> 查看详情 →</div></a>';
    return html;
  }).join('');
}

function renderRecords(list) {
  var box = document.getElementById('recordList');
  document.getElementById('recordCount').textContent = list.length ? '（' + list.length + '）' : '';
  if (!list.length) { box.innerHTML = '<p class="empty">暂无答题记录</p>'; return; }
  box.innerHTML = list.map(function (r) {
    var title = r.title || r.task_title || ('记录 #' + (r.id || ''));
    var html = '<div class="item"><div class="t">' + esc(title) + '</div>';
    var meta = [];
    if (r.score != null) meta.push('得分：' + esc(r.score));
    if (r.created_at) meta.push(esc(r.created_at));
    if (meta.length) html += '<div class="m">' + meta.join(' · ') + '</div>';
    return html + '</div>';
  }).join('');
}

var MASTERY = ['未开始', '待加强', '基本掌握', '已掌握'];

function renderKps(points) {
  var box = document.getElementById('kpList');
  kpPoints = points || [];
  updateStats();
  if (!points.length) { box.innerHTML = '<p class="empty">暂无考点</p>'; return; }
  box.innerHTML = points.map(function (p) {
    var level = p.mastery_level == null ? 0 : p.mastery_level;
    var total = p.total_questions || 0;
    var ans = p.answered || 0;
    var pct = total ? Math.round(100 * ans / total) : 0;
    var done = total > 0 && ans === total;
    var badge = done
      ? '<span class="badge done">已完成</span>'
      : '<span class="badge lv' + level + '">' + MASTERY[level] + '</span>';
    var num = (p.sort_order != null && p.sort_order !== '') ? '考点 ' + p.sort_order + ' · ' : '';
    var html = '<div class="kp-card"><div class="t"><a href="learn.html?kp=' + p.id + '">' + num + esc(p.title || '考点') + '</a> ' + badge + '</div>';
    if (p.description || p.intro) html += '<div class="d">' + esc(p.description || p.intro) + '</div>';
    html += '<div class="prog"><div class="fill" style="width:' + pct + '%"></div></div>' +
      '<div class="prog-text">' + ans + '/' + total + '题 · ' + pct + '%</div>';
    if ((p.basic_total || 0) > 0 || (p.advanced_total || 0) > 0) {
      html += '<div class="m">基础过关 ' + (p.basic_answered || 0) + '/' + (p.basic_total || 0) +
        ' · 能力提升 ' + (p.advanced_answered || 0) + '/' + (p.advanced_total || 0) + '</div>';
    }
    return html + '</div>';
  }).join('');
}

async function loadKps() {
  var k = await api('/student-api/knowledge-points', {});
  if (k.status === 401) { location.href = 'login.html'; return; }
  if (k.ok && k.data.ok) renderKps(k.data.points || []);
  else document.getElementById('kpList').innerHTML = '<p class="empty">考点加载失败，请刷新页面重试</p>';
}

function renderGrades(g) {
  var card = document.getElementById('gradesCard');
  var box = document.getElementById('gradesBody');
  if (!g) {
    card.style.display = 'none';
    return;
  }
  card.style.display = '';
  var html = '<table class="gtable"><thead><tr><th>考试</th><th>总分</th><th>班排</th><th>年级</th></tr></thead><tbody>';
  (g.exams || []).forEach(function (e) {
    html += '<tr><td>' + esc(e.name) + '</td><td class="num">' + esc(e.total) + '</td><td>' + esc(e.class_rank) + '</td><td>' + esc(e.grade_rank) + '</td></tr>';
  });
  html += '</tbody></table>';
  var meta = [];
  if (g.objective_rate) meta.push('客观得分率 <b>' + esc(g.objective_rate) + '</b>');
  if (g.subjective_rate) meta.push('主观得分率 <b>' + esc(g.subjective_rate) + '</b>');
  if (g.trend) meta.push('三次趋势 <b>' + esc(g.trend) + '</b>');
  if (g.category) meta.push('分类 <b>' + esc(g.category) + '</b>');
  if (meta.length) html += '<div class="gmeta"><span>' + meta.join('</span><span>') + '</span></div>';
  box.innerHTML = html;
}

async function loadGrades() {
  var g = await api('/student-api/student/grades', {});
  if (g.status === 401) { location.href = 'login.html'; return; }
  if (g.ok && g.data.ok) renderGrades(g.data.grades);
  else {
    document.getElementById('gradesCard').style.display = '';
    document.getElementById('gradesBody').innerHTML = '<p class="empty">成绩加载失败，请刷新页面重试</p>';
  }
}


function readFileAsDataURL(file) {
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onload = function () { resolve(reader.result); };
    reader.onerror = function () { reject(new Error('读取图片失败')); };
    reader.readAsDataURL(file);
  });
}

function renderQuestions(list) {
  var box = document.getElementById('qList');
  if (!list.length) { box.innerHTML = '<p class="empty">你还没有提过问题</p>'; return; }
  box.innerHTML = list.map(function (q) {
    var badge = q.status === 'answered'
      ? '<span class="badge lv3">已回复</span>'
      : '<span class="badge lv1">未回复</span>';
    var html = '<div class="item"><div class="d">' + esc(q.content || '') + '</div>';
    if (q.image_path) html += '<img class="qimg" src="/student-api/' + esc(q.image_path) + '" alt="题目图片">';
    html += '<div class="m">' + esc(q.created_at || '') + ' · ' + badge + '</div>';
    if (q.status === 'answered' && q.reply) {
      html += '<div class="qreply"><span class="who">老师回复：</span>' + esc(q.reply) + '</div>';
    }
    return html + '</div>';
  }).join('');
}

async function loadQuestions() {
  var r = await api('/student-api/student/questions', {});
  if (r.status === 401) { location.href = 'login.html'; return; }
  if (r.ok && r.data.ok) renderQuestions(r.data.questions || []);
  else document.getElementById('qList').innerHTML = '<p class="empty">提问加载失败，请刷新页面重试</p>';
}

document.getElementById('qSubmit').addEventListener('click', async function () {
  var btn = document.getElementById('qSubmit');
  var errBox = document.getElementById('qErr');
  errBox.classList.remove('show');
  var content = document.getElementById('qContent').value.trim();
  if (!content) { errBox.textContent = '请先写下你的问题'; errBox.classList.add('show'); return; }
  btn.disabled = true;
  try {
    var body = { content: content };
    var file = document.getElementById('qImage').files[0];
    if (file) {
      body.image_data = await readFileAsDataURL(file);
      body.image_name = file.name;
    }
    var r = await api('/student-api/student/questions', { method: 'POST', csrf: true, body: body });
    if (r.status === 401) { location.href = 'login.html'; return; }
    if (r.ok && r.data.ok) {
      document.getElementById('qContent').value = '';
      document.getElementById('qImage').value = '';
      loadQuestions();
    } else {
      errBox.textContent = (r.data && r.data.error) || '提交失败，请重试';
      errBox.classList.add('show');
    }
  } catch (e) {
    errBox.textContent = '提交失败，请重试';
    errBox.classList.add('show');
  }
  btn.disabled = false;
});

async function loadAll() {
  loadKps();
  loadGrades();
  loadQuestions();

  var t = await api('/student-api/student/tasks', {});
  if (t.status === 401) { location.href = 'login.html'; return; }
  if (t.ok && t.data.ok) renderTasks(t.data.tasks || []);
  else document.getElementById('taskList').innerHTML = '<p class="empty">任务加载失败，请刷新页面重试</p>';

  var w = await api('/student-api/student/wrong-questions', {});
  if (w.status === 401) { location.href = 'login.html'; return; }
  if (w.ok && w.data.ok) {
    wrongSum = w.data.summary || null;
    updateStats();
    renderWrong(w.data.wrong_questions || [], wrongSum);
  } else {
    document.getElementById('wrongSummary').innerHTML = '<p class="empty">错题加载失败，请刷新页面重试</p>';
    document.getElementById('wrongList').innerHTML = '<p class="empty">错题加载失败，请刷新页面重试</p>';
  }

  var r = await api('/student-api/student/records', {});
  if (r.status === 401) { location.href = 'login.html'; return; }
  if (r.ok && r.data.ok) renderRecords(r.data.records || []);
  else document.getElementById('recordList').innerHTML = '<p class="empty">答题记录加载失败，请刷新页面重试</p>';
}

async function init() {
  try {
    var r = await api('/student-api/me', {});
    if (r.status === 401) { location.href = 'login.html'; return; }
    if (!r.ok || !r.data.ok || !r.data.user) { showErr('获取登录信息失败，请刷新页面重试'); return; }
    me = r.data.user;
    if (me.csrf_token) sessionStorage.setItem('csrf_token', me.csrf_token);
    if (me.must_change_password === 1 || me.must_change_password === true) {
      location.href = 'change-password.html';
      return;
    }
    if (me.role === 'teacher') { location.href = 'teacher.html'; return; }
    if (me.role !== 'student') { location.href = 'login.html'; return; }
    document.getElementById('welcome').textContent = '你好，' + (me.name || me.username);
    document.getElementById('classLine').textContent = me.class_name ? '班级：' + me.class_name : '';
    document.getElementById('userLine').textContent = '用户名：' + me.username;
    loadAll();
  } catch (e) {
    showErr('网络异常，请检查网络后刷新页面');
  }
}

document.getElementById('logoutBtn').addEventListener('click', async function () {
  try {
    await api('/student-api/logout', { method: 'POST', csrf: true });
  } catch (e) { /* 退出失败也照常回登录页 */ }
  sessionStorage.removeItem('csrf_token');
  location.href = 'login.html';
});

init();
</script>
</body>
