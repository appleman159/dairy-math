<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>修改密码 · 学生数学复习平台</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; background: #f1f5f9; color: #1e293b; }
.topbar { background: #0E6B66; color: #fff; padding: 14px 16px; }
.topbar .inner { max-width: 960px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
.topbar h1 { font-size: 18px; margin: 0; }
.topbar a { color: #fff; font-size: 14px; text-decoration: none; }
.container { max-width: 520px; margin: 0 auto; padding: 24px 16px 40px; }
.card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px 20px; }
h2 { font-size: 22px; margin: 0 0 4px; color: #0f172a; }
.sub { color: #64748b; font-size: 14px; margin: 0 0 10px; }
label { display: block; font-size: 14px; font-weight: 700; margin: 14px 0 6px; }
input { width: 100%; padding: 11px 12px; font-size: 16px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; }
input:focus { outline: 2px solid #99d5d1; border-color: #0E6B66; }
.btn { display: block; width: 100%; border: none; border-radius: 8px; padding: 12px; font-size: 16px; font-weight: 700; cursor: pointer; background: #0E6B66; color: #fff; margin-top: 20px; }
.btn:hover { background: #0a5651; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.err { display: none; background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; border-radius: 8px; padding: 10px 12px; font-size: 14px; margin-top: 14px; }
.err.show { display: block; }
.okmsg { display: none; background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; border-radius: 8px; padding: 10px 12px; font-size: 14px; margin-top: 14px; }
.okmsg.show { display: block; }
.back { display: block; text-align: center; color: #0E6B66; font-size: 14px; margin-top: 16px; text-decoration: none; }
</style>
</head>
<body>
<div class="topbar">
  <div class="inner">
    <h1>学生数学复习平台</h1>
    <a href="/">返回课件资源站</a>
  </div>
</div>
<main class="container">
  <div class="card">
    <h2>修改密码</h2>
    <p class="sub" id="subLine">请设置一个自己能记住的新密码</p>
    <form id="pwdForm">
      <label for="currentPwd">当前密码</label>
      <input id="currentPwd" type="password" autocomplete="current-password" placeholder="请输入当前密码" required>
      <label for="newPwd">新密码</label>
      <input id="newPwd" type="password" autocomplete="new-password" placeholder="至少 6 位" required>
      <label for="newPwd2">确认新密码</label>
      <input id="newPwd2" type="password" autocomplete="new-password" placeholder="请再输入一次新密码" required>
      <div class="err" id="err"></div>
      <div class="okmsg" id="okmsg"></div>
      <button class="btn" type="submit" id="submitBtn">确认修改</button>
    </form>
    <a class="back" id="backLink" href="student.html">返回我的首页</a>
  </div>
</main>
<script>
var me = null;

function showErr(msg) {
  var e = document.getElementById('err');
  e.textContent = msg;
  e.classList.add('show');
}
function hideErr() {
  document.getElementById('err').classList.remove('show');
}
function showOk(msg) {
  var e = document.getElementById('okmsg');
  e.textContent = msg;
  e.classList.add('show');
}

async function api(path, opts) {
  opts = opts || {};
  var headers = { 'Content-Type': 'application/json' };
  if (opts.csrf) headers['X-CSRF-Token'] = sessionStorage.getItem('csrf_token') || '';
  var res = await fetch(path, {
    method: opts.method || 'GET',
    credentials: 'include',
    headers: headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  var data = null;
  try { data = await res.json(); } catch (e) {}
  return { status: res.status, ok: res.ok, data: data || {} };
}

document.getElementById('pwdForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  hideErr();
  var cur = document.getElementById('currentPwd').value;
  var p1 = document.getElementById('newPwd').value;
  var p2 = document.getElementById('newPwd2').value;
  if (!cur || !p1 || !p2) { showErr('请把三项都填好'); return; }
  if (p1.length < 6) { showErr('新密码至少 6 位'); return; }
  if (p1 !== p2) { showErr('两次输入的新密码不一致'); return; }
  if (p1 === cur) { showErr('新密码不能和当前密码相同'); return; }
  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '修改中…';
  try {
    var r = await api('/student-api/change-password', {
      method: 'POST', csrf: true,
      body: { current_password: cur, new_password: p1 }
    });
    if (r.status === 401) {
      // 可能是当前密码错，也可能是登录已过期：用 /me 区分
      var meRes = await api('/student-api/me', {});
      if (meRes.status === 401) { location.href = 'login.html'; return; }
      showErr('当前密码不正确，请重新输入');
    } else if (r.ok && r.data.ok) {
      showOk('密码修改成功，正在返回…');
      setTimeout(function () {
        location.href = (me && me.role === 'teacher') ? 'teacher.html' : 'student.html';
      }, 800);
    } else {
      showErr((r.data && r.data.error) || '修改失败，请稍后再试');
    }
  } catch (err) {
    showErr('网络异常，请检查网络后重试');
  } finally {
    btn.disabled = false;
    btn.textContent = '确认修改';
  }
});

(async function init() {
  try {
    var r = await api('/student-api/me', {});
    if (r.status === 401) { location.href = 'login.html'; return; }
    if (!r.ok || !r.data.ok || !r.data.user) { showErr('获取登录信息失败，请刷新页面重试'); return; }
    me = r.data.user;
    if (me.csrf_token) sessionStorage.setItem('csrf_token', me.csrf_token);
    document.getElementById('backLink').href = me.role === 'teacher' ? 'teacher.html' : 'student.html';
    if (me.must_change_password === 1 || me.must_change_password === true) {
      document.getElementById('subLine').textContent = '首次登录请先修改初始密码，改完才能进入首页';
    }
  } catch (e) {
    showErr('网络异常，请检查网络后刷新页面');
  }
})();
</script>
</body>
</html>
