<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学生数学复习平台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: #f4f6f8; color: #1d1d1f; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 48px 16px; }
  .card { background: #fff; border-radius: 16px; box-shadow: 0 2px 16px rgba(0,0,0,.08); max-width: 560px; width: 100%; padding: 36px 32px; text-align: center; }
  h1 { font-size: 26px; margin-bottom: 10px; }
  p.sub { color: #666; font-size: 15px; line-height: 1.8; margin-bottom: 24px; }
  .status { display: inline-block; padding: 8px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; background: #fef3c7; color: #92400e; }
  .status.ok { background: #dcfce7; color: #166534; }
  .status.bad { background: #fee2e2; color: #991b1b; }
  .links { margin-top: 28px; font-size: 14px; color: #888; line-height: 2; }
  .links a { color: #2563eb; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <h1>📊 学生数学复习平台</h1>
  <p class="sub">这里是班级数学复习平台的首页。<br>登录、专题复习、在线答题、错题本等功能正在建设中，敬请期待。</p>
  <div class="status" id="status">正在连接后端…</div>
  <div class="links">
    <a href="/">← 返回班级资源站首页</a><br>
    <span>第一阶段：基础框架已搭建</span>
  </div>
</div>
<script>
fetch('/student-api/health')
  .then(function (r) { return r.json(); })
  .then(function (d) {
    var el = document.getElementById('status');
    if (d && d.ok) {
      el.textContent = '后端连接正常（' + (d.service || 'student') + ' v' + (d.version || '') + '）';
      el.className = 'status ok';
    } else {
      el.textContent = '后端返回异常';
      el.className = 'status bad';
    }
  })
  .catch(function () {
    var el = document.getElementById('status');
    el.textContent = '后端连接失败';
    el.className = 'status bad';
  });
</script>
</body>
</html>
