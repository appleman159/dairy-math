<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>班级签到</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #F7F3EB; color: #222; font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 26px; margin: 8px 0 4px; color: #0E6B66; }
  .sub { font-size: 15px; color: #666; margin-bottom: 18px; }
  .cls-row { display: flex; gap: 12px; margin-bottom: 16px; }
  .cls-btn { flex: 1; padding: 16px 0; font-size: 20px; font-weight: bold; text-align: center;
    background: #fff; border: 2px solid #DDD6C4; border-radius: 12px; cursor: pointer; color: #222; }
  .cls-btn.on { background: #0E6B66; border-color: #0E6B66; color: #fff; }
  #search { width: 100%; padding: 13px 14px; font-size: 17px; border: 2px solid #DDD6C4;
    border-radius: 10px; background: #fff; margin-bottom: 14px; outline: none; }
  #search:focus { border-color: #0E6B66; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  @media (max-width: 520px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  .name-btn { padding: 13px 4px; font-size: 17px; text-align: center; background: #fff;
    border: 2px solid #DDD6C4; border-radius: 10px; cursor: pointer; }
  .name-btn.on { background: #D95D39; border-color: #D95D39; color: #fff; font-weight: bold; }
  .name-btn.done { background: #E9E7E0; border-color: #D5D2C8; color: #9A968A; cursor: not-allowed; }
  #submit { width: 100%; padding: 16px 0; margin-top: 20px; font-size: 20px; font-weight: bold;
    background: #0E6B66; color: #fff; border: none; border-radius: 12px; cursor: pointer; }
  #submit:disabled { background: #B9B2A0; cursor: not-allowed; }
  #msg { margin-top: 18px; padding: 16px; font-size: 18px; line-height: 1.6; border-radius: 12px; display: none; }
  #msg.ok { display: block; background: #E8F0E9; color: #0E6B66; border: 2px solid #0E6B66; }
  #msg.err { display: block; background: #FDECEA; color: #C62828; border: 2px solid #C62828; }
  .back { display: inline-block; margin-top: 24px; font-size: 15px; color: #0E6B66; }
  .hint { font-size: 14px; color: #888; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>✏️ 班级签到</h1>
  <div class="sub">先选自己的班，再点自己的名字，最后点“提交签到”。一个人只能签一次。</div>

  <div class="cls-row">
    <div class="cls-btn" id="btn-8" onclick="pickClass('8班')">高二 8 班</div>
    <div class="cls-btn" id="btn-9" onclick="pickClass('9班')">高二 9 班</div>
  </div>

  <div id="pick-area" style="display:none">
    <input id="search" type="text" placeholder="搜自己的名字…" oninput="renderNames()">
    <div class="grid" id="grid"></div>
    <button id="submit" onclick="submitCheckin()" disabled>请先点自己的名字</button>
    <div class="hint">点错了可以重选，提交之前都能改。提交后不能改，找老师处理。</div>
  </div>

  <div id="msg"></div>
  <a class="back" href="./">← 回到班级资源站首页</a>
</div>

<script>
let roster = {}, curClass = null, selected = null, signed = {};

async function load() {
  try {
    roster = await (await fetch('/api/roster')).json();
  } catch (e) {
    showMsg('err', '名单加载失败，请检查网络后刷新页面再试。');
    return;
  }
  await refreshSigned();
  const saved = JSON.parse(localStorage.getItem('qzm-qiandao') || 'null');
  if (saved && saved.name) {
    showMsg('ok', '✅ ' + saved.name + '，你已经签到过了<br>班级：' + saved.class + '<br>时间：' + saved.time);
    document.getElementById('pick-area').style.display = 'none';
  }
}
async function refreshSigned() {
  try {
    const d = await (await fetch('/api/list')).json();
    const s = {};
    for (const c in (d.classes || {})) {
      s[c] = new Set((d.classes[c].signed_list || []).map(x => x.name));
    }
    signed = s;
  } catch (e) { /* 取不到已签名单就不置灰，提交时服务端仍会拦重签 */ }
}
function pickClass(c) {
  curClass = c; selected = null;
  document.getElementById('btn-8').classList.toggle('on', c === '8班');
  document.getElementById('btn-9').classList.toggle('on', c === '9班');
  document.getElementById('pick-area').style.display = 'block';
  document.getElementById('search').value = '';
  renderNames();
  refreshSigned().then(renderNames);
}
function renderNames() {
  const q = document.getElementById('search').value.trim();
  const grid = document.getElementById('grid');
  const names = (roster[curClass] || []).filter(n => !q || n.indexOf(q) !== -1);
  const done = signed[curClass] || new Set();
  grid.innerHTML = names.map(n => {
    if (done.has(n)) return '<div class="name-btn done">✓ ' + n + '</div>';
    return '<div class="name-btn' + (n === selected ? ' on' : '') + '" onclick="pickName(\'' + n + '\')">' + n + '</div>';
  }).join('') || '<div style="grid-column:1/-1;color:#888;padding:10px">没找到这个名字，换个字试试</div>';
  updateSubmit();
}
function pickName(n) {
  if ((signed[curClass] || new Set()).has(n)) return;
  selected = n;
  renderNames();
}
function updateSubmit() {
  const b = document.getElementById('submit');
  if (selected) { b.disabled = false; b.textContent = '提交签到：' + selected; }
  else { b.disabled = true; b.textContent = '请先点自己的名字'; }
}
async function submitCheckin() {
  if (!selected) return;
  const b = document.getElementById('submit');
  b.disabled = true; b.textContent = '提交中…';
  try {
    const r = await fetch('/api/checkin', { method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ class: curClass, name: selected }) });
    const d = await r.json();
    if (d.ok) {
      localStorage.setItem('qzm-qiandao', JSON.stringify({ class: curClass, name: selected, time: d.time }));
      showMsg('ok', (d.already ? '✅ 你已经签到过了<br>' : '✅ 签到成功<br>') + selected + '（' + curClass + '）<br>时间：' + d.time);
      document.getElementById('pick-area').style.display = 'none';
    } else {
      showMsg('err', '提交失败：' + (d.error || '请重试'));
      updateSubmit();
    }
  } catch (e) {
    showMsg('err', '提交失败，请检查网络后重试。');
    updateSubmit();
  }
}
function showMsg(kind, html) {
  const m = document.getElementById('msg');
  m.className = kind; m.innerHTML = html;
}
load();
</script>
</body>
</html>
